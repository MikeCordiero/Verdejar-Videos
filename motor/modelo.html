<!doctype html>
<html lang="en">
<!-- Motor de vídeos da Verdejar. Feito com a skill Bang Motion (Bang Tutorial, MIT).
     Recebe um PLANO (cenas + falas + tempos da voz) e anima-o; tudo é função do tempo da timeline. -->
<head>
<meta charset="utf-8">
<title>Verdejar — vídeo</title>
<style>
%%FONTES%%
html,body{margin:0;height:100%;background:#2B2620;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;background:#F2B544}
#world{position:absolute;inset:0}
#scene{position:absolute;inset:0}
#band{position:absolute;left:0;top:0;width:1080px;height:760px;pointer-events:none;
  background:linear-gradient(#F2B544 0%,rgba(242,181,68,.92) 38%,rgba(242,181,68,.55) 62%,rgba(242,181,68,0) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.32}
#txt{position:absolute;inset:0;pointer-events:none;font-family:'Manrope';color:#2B2620}
.cap{position:absolute;left:70px;right:70px;top:210px;text-align:center;font-weight:800;font-size:78px;line-height:1.12;letter-spacing:-1.5px;opacity:1}
.cap .w{display:inline-block;opacity:0;margin:0 .12em}
.cap .s{font-family:'Caveat Brush';font-weight:400;color:#8A3A1F;font-size:1.42em;letter-spacing:0;line-height:.9;white-space:nowrap}
.hook{top:170px;font-size:100px;line-height:1.04;letter-spacing:-2.5px}
.hook .s{font-size:1.75em}
#pill{position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:900px;top:220px;background:#FDF8F2;color:#2B2620;font-family:'Manrope';font-weight:800;font-size:70px;line-height:1.12;letter-spacing:-1.5px;padding:34px 70px;border-radius:64px;text-align:center;opacity:0}
#pill .s{font-family:'Caveat Brush';font-weight:400;color:#8A3A1F;font-size:1.35em;letter-spacing:0}
#luzes{position:absolute;left:0;top:0;width:1080px;height:140px;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="world"><svg id="scene" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
  <div id="band"></div>
  <svg id="luzes" viewBox="0 0 1080 140"></svg>
  <div id="txt"><div id="pill"></div></div>
  <div id="grain"></div>
</div>
<audio id="vo" src="%%AUDIO%%" preload="auto"></audio>
<script>%%GSAP%%</script>
<script>
const PLANO=%%PLANO%%;
const $=(s,r=document)=>r.querySelector(s);
const W=1080,H=1920,NS='http://www.w3.org/2000/svg';
const DUR=PLANO.duracao;
const C={mustard:'#F2B544',sun:'#EE8A49',sunHot:'#F39A57',olive:'#44502A',vein:'#A9BC8A',ink:'#2B2620',rust:'#8A3A1F',cream:'#FDF8F2',
  lilac:'#9A8FC4',lilacD:'#7F73AE',sage:'#7E9068',sageL:'#C9D6B2',stripePink:'#F0A8A0',water:'#7FB2C2',
  soilWet:'#4A3020',soilDry:'#A57B4C',sick:'#D9A93A',sick2:'#A7782E',night:'#24323E',frio:'#9EC3D6',brown:'#8A5A2B'};
const VASOS={azul:'#2E5D73',rosa:'#DE7C85',lilas:'#9A8FC4',terracota:'#C4713C',creme:'#EADFC8',verde:'#5E7A55'};
const FLORES={vermelho:'#D9364B',rosa:'#E86A8C',branco:'#F6F1E7',roxo:'#8E6CC2',amarelo:'#F2C230',laranja:'#EE8A49'};
const LERP=gsap.utils.interpolate;
const sh=(hex,f)=>{const n=parseInt(hex.slice(1),16);const r=Math.min(255,Math.round(((n>>16)&255)*f)),g=Math.min(255,Math.round(((n>>8)&255)*f)),b=Math.min(255,Math.round((n&255)*f));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),rad=d=>d*Math.PI/180;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}addEventListener('resize',fit);fit();

/* ---------- desenho ---------- */
const S=$('#scene');
function N(tag,a={},p=S){const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n;}
const G=(a={},p=S)=>N('g',a,p),R=(x,y,w,h,f,rx=0,p=S,a={})=>N('rect',{x,y,width:w,height:h,rx,fill:f,...a},p),
  CI=(cx,cy,r,f,p=S,a={})=>N('circle',{cx,cy,r,fill:f,...a},p),EL=(cx,cy,rx,ry,f,p=S,a={})=>N('ellipse',{cx,cy,rx,ry,fill:f,...a},p),
  PA=(d,f,p=S,a={})=>N('path',{d,fill:f||'none',...a},p),
  LN=(d,st,w,p=S,a={})=>N('path',{d,fill:'none',stroke:st,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',...a},p),
  TX=(x,y,t,size,f,p=S,a={})=>{const n=N('text',{x,y,'font-size':size,fill:f,'font-family':'Manrope','font-weight':800,'text-anchor':'middle',...a},p);n.textContent=t;return n;};
const tf=(el,x,y,r=0,sx=1,sy=sx)=>el.setAttribute('transform',`translate(${x},${y}) rotate(${r}) scale(${sx},${sy})`);
const defs=N('defs',{},S);let uid=0;

/* traço à mão que "ferve" a 6 fps (determinístico) */
const fR=N('filter',{id:'rough',x:0,y:0,width:1080,height:1920,filterUnits:'userSpaceOnUse'},defs);
const turb=N('feTurbulence',{type:'fractalNoise',baseFrequency:'0.022',numOctaves:2,seed:1,result:'t'},fR);
N('feDisplacementMap',{in:'SourceGraphic',in2:'t',scale:7,xChannelSelector:'R',yChannelSelector:'G'},fR);
const worldG=G({filter:'url(#rough)'},S);

const scenes=[];
function scene(name){const g=G({'data-name':name},worldG);g.style.display='none';const sc={name,g,cam:{x:540,y:960,z:1.1,ox:0,oy:0},
  apply(){const c=sc.cam;g.setAttribute('transform',`translate(${540-(c.x+c.ox)*c.z},${960-(c.y+c.oy)*c.z}) scale(${c.z})`);}};sc.apply();scenes.push(sc);return sc;}
const GY=1480;

/* ---------- fundo partilhado ---------- */
function sunOf(p,cx){const g=G({},p);const body=PA('',C.sun,g);
  const rays=[];for(let i=0;i<9;i++){const a=-80+i*20;const r=G({},g);LN('M0 0 L0 -46',C.cream,13,r);rays.push({g:r,a});}
  return {g,body,rays,cx,y:0,heat:0,k:1};}
function renderSun(s,t){const k=s.k*(1+.012*Math.sin(t*1.1));tf(s.g,0,s.y,0,1,1);const r=470*k;
  s.body.setAttribute('d',`M${s.cx-r} ${GY} A${r} ${r} 0 0 1 ${s.cx+r} ${GY} Z`);s.body.setAttribute('fill',LERP(C.sun,C.sunHot,s.heat));
  s.rays.forEach((ry,i)=>{const pul=.5+.5*Math.sin(t*1.6+i*1.3),R0=r+90+18*pul;const a=rad(ry.a);
    tf(ry.g,s.cx+Math.sin(a)*R0,GY-Math.cos(a)*R0,ry.a,1,.7+.5*pul);ry.g.setAttribute('opacity',.35+.55*pul);});}
function floorOf(p,x0=-700,x1=1800){let d=`M${x0} ${GY}`;for(let x=x0;x<=x1;x+=60)d+=` L${x} ${GY+((Math.abs(x)*37)%11)-4}`;d+=` L${x1} 2600 L${x0} 2600 Z`;return PA(d,C.olive,p);}
function motesOf(p,n){const m=[];for(let i=0;i<n;i++)m.push(CI(0,0,3+(i%3)*2,C.cream,p,{opacity:0}));return m;}
function renderMotes(m,t,x0=60,x1=1020){m.forEach((c,i)=>{const sp=14+(i%4)*5,ph=(t*sp+i*137)%900;
  c.setAttribute('cx',x0+((i*173)%(x1-x0))+Math.sin(t*.7+i)*18);c.setAttribute('cy',1420-ph);c.setAttribute('opacity',(.15+.35*(.5+.5*Math.sin(t*1.3+i*2)))*Math.sin(Math.PI*ph/900));});}
function shadowOf(p){return PA('M0 0 C60 -120 220 -150 300 -40 C340 20 260 120 160 110 C220 180 120 260 40 200 C-40 240 -120 160 -60 90 C-160 60 -120 -40 0 0 Z','#3A2A10',p,{opacity:.06});}
const renderShadow=(s,t,y,x0=-420,span=1900)=>tf(s,x0+((t*28)%span),y,t*3,1.6);

/* ---------- vaso ---------- */
function potOf(p,cx,cor,s=1){const g=G({transform:`translate(${cx},0)`},p),inner=G({transform:`translate(0,${GY}) scale(${s}) translate(0,${-GY})`},g);
  const body=PA(`M-150 1212 L150 1212 L118 ${GY} Q0 ${GY+10} -118 ${GY} Z`,cor,inner);
  const front=G({},inner);
  LN('M-138 1300 Q-80 1284 -20 1300 T100 1298 T138 1292',C.cream,10,front);LN('M-130 1350 Q-70 1336 -10 1352 T110 1348 T128 1344',C.stripePink,9,front);
  const rim=R(-168,1168,336,50,sh(cor,.78),16,inner);
  return {g,inner,body,front,rim,cor,soilY:GY-(GY-1184)*s};}

/* ---------- plantas: seis formas, a mesma interface {g, s:{h,ill}, render(t)} ---------- */
const TONES={D:'#3E4A26',M:'#55633F',L:'#6E8052',Y:'#8DA266'};
const LEAVES=[[0,1,440,214,124,'D',.4],[-14,-15,410,218,126,'D',.7],[14,17,400,212,122,'D',.5],[-24,-33,345,208,120,'D',.9],[24,35,350,210,122,'D',.6],
  [-8,-7,345,226,130,'M',.8],[10,8,330,218,126,'M',.3],[-30,-51,262,204,118,'M',1],[30,53,268,206,120,'M',.8],
  [-18,-23,240,196,116,'L',.9],[18,25,232,192,114,'L',.5],[-36,-70,160,182,108,'L',1],[36,72,165,184,110,'L',.9],[-4,-3,220,128,74,'Y',.2],[6,12,170,104,62,'Y',.3]];
function folhagem(p,cx,soilY,sc,op={}){const g=G({transform:`translate(${cx},${soilY}) scale(${sc})`},p);const flor=op.corFlor?FLORES[op.corFlor]||op.corFlor:null;
  const L=LEAVES.map(([bx,a,len,b,w,tone,k],i)=>{const stem=LN('',TONES.D,8,g);const bl=G({},g);const tip=i%2?1:-1;
    const brac=op.bracteas&&flor&&i<9;const base=brac?flor:TONES[tone];
    const blade=PA(`M0 0 C${w*.66} ${-b*.16} ${w*.6} ${-b*.72} ${tip*w*.06} ${-b} C${-w*.5} ${-b*.78} ${-w*.66} ${-b*.2} 0 0 Z`,base,bl);
    const shade=PA(`M0 0 C${w*.66} ${-b*.16} ${w*.6} ${-b*.72} ${tip*w*.06} ${-b} Q${w*.1} ${-b*.5} 0 0 Z`,sh(base,.84),bl);
    const vein=LN(`M0 -6 Q${w*.07} ${-b*.5} ${tip*w*.04} ${-b*.88}`,brac?sh(base,1.25):C.vein,4.5,bl);
    let fl=null;if(flor&&!op.bracteas&&[0,1,2,5,6].includes(i)){fl=G({},g);for(let j=0;j<5;j++){const a2=rad(j*72);EL(Math.sin(a2)*30,-Math.cos(a2)*30,24,32,flor,fl,{transform:`rotate(${j*72} ${Math.sin(a2)*30} ${-Math.cos(a2)*30})`});}CI(0,0,16,C.mustard,fl);}
    return {bx,a,len,b,w,tone,k,i,stem,bl,blade,shade,vein,base,fl};});
  if(op.bracteas&&flor){const c=G({},g);for(let j=0;j<5;j++)CI((j-2)*12,(j%2)*10,9,C.mustard,c);L.centro=c;}
  const P={g,L,s:{h:1,ill:0},render(t){const {h,ill}=P.s;let topo=null;
    L.forEach(l=>{const d=l.a===0?(l.i%2?1:-1):Math.sign(l.a)||1;
      const sway=Math.sin(t*1.25+l.i*1.7)*(1.5*h+.5)+Math.sin(t*.55+l.i)*1.1+(P.s.treme||0)*Math.sin(t*31+l.i)*3;
      const a=l.a+(1-h)*d*(30+26*Math.abs(l.a)/70)+sway+(P.s.lean||0),ar=rad(a),len=l.len*(1-.2*(1-h));
      const tx=l.bx+Math.sin(ar)*len,ty=-Math.cos(ar)*len,sag=(1-h)*44*d+h*7*d,mx=(l.bx+tx)/2+Math.cos(ar)*sag,my=ty/2+Math.sin(ar)*sag;
      l.stem.setAttribute('d',`M${l.bx} 0 Q${mx} ${my} ${tx} ${ty}`);
      const m=clamp(ill*l.k*1.25),sk=P.s.queima?C.brown:(l.k>.7?C.sick2:C.sick);
      l.stem.setAttribute('stroke',LERP(TONES.D,'#7A6630',m*.8));l.blade.setAttribute('fill',LERP(l.base,sk,m));l.shade.setAttribute('fill',LERP(sh(l.base,.84),sh(sk,.86),m));
      const ang=a+(1-h)*d*58+Math.sin(t*1.9+l.i)*1.5;tf(l.bl,tx,ty,ang,1,1-.12*(1-h));
      if(l.fl)tf(l.fl,tx+Math.sin(rad(ang))*l.b*.9,ty-Math.cos(rad(ang))*l.b*.9,ang,.85*(.5+.5*h));
      if(l.i===0)topo=[tx,ty];});
    if(L.centro&&topo)tf(L.centro,topo[0]*.15,topo[1]*.62,0,1);}};
  return P;}
function cato(p,cx,soilY,sc,op={}){const g=G({transform:`translate(${cx},${soilY}) scale(${sc})`},p),b=G({},g);const fl=op.corFlor?FLORES[op.corFlor]||op.corFlor:FLORES.rosa;
  const body=PA('M-78 0 C-84 -230 -56 -320 0 -320 C56 -320 84 -230 78 0 Z',C.sage,b);
  const arm=PA('M68 -150 C110 -150 132 -176 132 -232 C132 -262 98 -262 98 -232 L98 -192 L70 -188 Z',C.sage,b);
  const arm2=PA('M-68 -110 C-104 -110 -122 -130 -122 -170 C-122 -196 -94 -196 -94 -172 L-94 -142 L-70 -140 Z',C.sage,b);
  [-44,-16,16,44].forEach(o=>LN(`M${o} -300 Q${o*1.15} -150 ${o*1.1} -8`,'#5E7050',5,b));
  for(let i=0;i<14;i++)LN(`M${((i*37)%120)-60} ${-40-((i*53)%250)} l7 -7`,C.cream,3,b,{opacity:.8});
  const f=G({transform:'translate(0,-326)'},b);for(let j=0;j<6;j++)EL(Math.sin(rad(j*60))*16,-Math.cos(rad(j*60))*16,12,18,fl,f,{transform:`rotate(${j*60} ${Math.sin(rad(j*60))*16} ${-Math.cos(rad(j*60))*16})`});CI(0,0,9,C.mustard,f);
  const P={g,s:{h:1,ill:0},render(t){const {h,ill}=P.s;tf(b,0,0,(1-h)*9+Math.sin(t*.9)*.8+(P.s.lean||0)*.3+(P.s.treme||0)*Math.sin(t*31)*1.5,1,1-.05*(1-h));
    const c=LERP(C.sage,'#B7A14E',clamp(ill));[body,arm,arm2].forEach(e=>e.setAttribute('fill',c));tf(f,0,-326,0,h>.6?1:.6);}};return P;}
function espada(p,cx,soilY,sc,op={}){const g=G({transform:`translate(${cx},${soilY}) scale(${sc})`},p);
  const F=[[-54,-14,360],[-26,-5,460],[0,1,520],[26,6,440],[54,15,370],[-10,-24,300],[12,22,310]].map(([o,a,hh],i)=>{const l=G({},g);
    const bl=PA(`M-24 0 C-30 ${-hh*.5} -14 ${-hh*.85} 4 ${-hh} C16 ${-hh*.8} 26 ${-hh*.5} 24 0 Z`,i%2?TONES.M:TONES.D,l);
    LN(`M-21 -10 C-26 ${-hh*.5} -12 ${-hh*.84} 3 ${-hh+6}`,'#C9B65A',5,l);for(let k=1;k<6;k++)LN(`M-14 ${-hh*k/6.5} q14 -10 26 0`,TONES.L,4,l,{opacity:.7});
    return {l,bl,o,a,hh,i};});
  const P={g,s:{h:1,ill:0},render(t){const {h,ill}=P.s;F.forEach(f=>{const d=f.a===0?1:Math.sign(f.a);
    tf(f.l,f.o,0,f.a+(1-h)*d*38+Math.sin(t*1.1+f.i)*1.4+(P.s.lean||0)*.4+(P.s.treme||0)*Math.sin(t*31+f.i)*2,1,1-.12*(1-h));
    f.bl.setAttribute('fill',LERP(f.i%2?TONES.M:TONES.D,f.i%3?C.sick:C.sick2,clamp(ill*(.6+.15*f.i))));});}};return P;}
function palmeira(p,cx,soilY,sc,op={}){const g=G({transform:`translate(${cx},${soilY}) scale(${sc})`},p);
  const F=[[-60,420],[-34,500],[-12,540],[10,530],[32,490],[58,430],[-80,330],[80,340]].map(([a,len],i)=>({a,len,i,stem:LN('',TONES.D,7,g),lf:Array.from({length:14},(_,k)=>PA('',k%2?TONES.M:TONES.L,g))}));
  const P={g,s:{h:1,ill:0},render(t){const {h,ill}=P.s;F.forEach(f=>{const d=Math.sign(f.a)||1;
    const a=rad(f.a*(1+.5*(1-h))+Math.sin(t*1.1+f.i)*2+(P.s.lean||0)+(P.s.treme||0)*Math.sin(t*31+f.i)*3),L=f.len;
    const ex=Math.sin(a)*L,ey=-Math.cos(a)*L*(1-.35*(1-h))+(1-h)*120,mx=Math.sin(a)*L*.45,my=-Math.cos(a)*L*.75-60*h;
    f.stem.setAttribute('d',`M0 0 Q${mx} ${my} ${ex} ${ey}`);
    f.lf.forEach((l,k)=>{const u=.2+Math.floor(k/2)*.105+(k%2)*.03,x=2*(1-u)*u*mx+u*u*ex,y=2*(1-u)*u*my+u*u*ey;const sd=k%2?1:-1,ln=118*(1-u*.45),wd=15*(1-u*.3);
      const ang=Math.atan2(2*(1-u)*(my)+2*u*(ey-my),2*(1-u)*mx+2*u*(ex-mx))+sd*rad(38+(1-h)*28);const ca=Math.cos(ang),sa=Math.sin(ang),px=-sa*wd,py=ca*wd,ex2=x+ca*ln,ey2=y+sa*ln+(26+30*(1-h));
      l.setAttribute('d',`M${x} ${y} Q${x+ca*ln*.5+px} ${y+sa*ln*.5+py+8} ${ex2} ${ey2} Q${x+ca*ln*.5-px} ${y+sa*ln*.5-py+8} ${x} ${y} Z`);
      l.setAttribute('fill',LERP(k%2?TONES.M:TONES.L,u>.7?C.brown:C.sick,clamp(ill*(u>.7?1.4:.8))));});});}};return P;}
function arvore(p,cx,soilY,sc,op={}){const g=G({transform:`translate(${cx},${soilY}) scale(${sc})`},p),b=G({},g);
  R(-18,-70,36,74,'#6B4A30',4,b);const tiers=[[-150,190,-70],[-125,170,-180],[-100,140,-280],[-72,108,-370]].map(([w0,w1,y],i)=>PA(`M${w0} ${y} L0 ${y-170} L${-w0} ${y} Q0 ${y+26} ${w0} ${y} Z`,i%2?TONES.M:TONES.D,b));
  const lz=[];if(op.luzes!==false)for(let i=0;i<16;i++){const y=-100-((i*37)%300),x=((i*71)%(200-((-y-100)/300)*120))-(100-((-y-100)/300)*60);lz.push(CI(x,y,9,['#F2C230','#D9364B','#FDF8F2','#7FB2C2'][i%4],b));}
  const star=PA('M0 -560 L12 -530 L44 -528 L19 -508 L28 -476 L0 -494 L-28 -476 L-19 -508 L-44 -528 L-12 -530 Z',C.mustard,b);
  const P={g,s:{h:1,ill:0},render(t){const {h,ill}=P.s;tf(b,0,0,(1-h)*6+Math.sin(t*.8)*.6+(P.s.treme||0)*Math.sin(t*31)*1.2,1,1);
    tiers.forEach((e,i)=>e.setAttribute('fill',LERP(i%2?TONES.M:TONES.D,'#8C7A3A',clamp(ill))));lz.forEach((c,i)=>c.setAttribute('opacity',.45+.55*(.5+.5*Math.sin(t*4+i*1.7))));}};return P;}
const FORMAS={folhagem,flor:folhagem,cato,espada,palmeira,arvore};
function plantaDe(p,cx,soilY,sc,cfg={}){const f=FORMAS[cfg.forma]||folhagem;const s={folhagem:1,flor:1,cato:1.25,espada:1.05,palmeira:1,arvore:1.15}[cfg.forma]||1;const P=f(p,cx,soilY,sc*s,cfg);Object.assign(P.s,{lean:0,treme:0,queima:0},{h:P.s.h,ill:P.s.ill});return P;}

/* ---------- adereços ---------- */
function canOf(p){const g=G({},p);
  LN('M62 -66 C150 -112 178 36 86 52',C.lilacD,20,g);
  PA('M-80 22 L-236 -92 L-226 -104 L-70 -6 Z',C.lilacD,g);EL(-236,-100,22,12,C.lilacD,g,{transform:'rotate(-36 -236 -100)'});
  PA('M-96 -70 Q-100 74 -82 78 L82 78 Q100 74 96 -70 Z',C.lilac,g);EL(0,-70,96,20,C.lilacD,g);LN('M-92 10 Q0 22 92 10',C.cream,10,g);return g;}
const CANTIP=[-246,-104];
function tipOf(o,lp,s=1){const a=rad(o.r),x=lp[0]*s,y=lp[1]*s;return [o.x+x*Math.cos(a)-y*Math.sin(a),o.y+x*Math.sin(a)+y*Math.cos(a)];}

/* ================= PALCO A — a casa ================= */
const A=scene('casa'),pA=A.g;
R(-700,-600,2500,3400,C.mustard,0,pA);
const shA=shadowOf(pA),sunA=sunOf(pA,540),motesA=motesOf(pA,16);
