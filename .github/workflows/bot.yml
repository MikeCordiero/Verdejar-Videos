# Publica o bot imediato do «Comment APP» no Cloudflare (worker/) e liga a página da Verdejar aos
# avisos da Meta. Corre quando worker/ muda, ou à mão (Run workflow).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, META_APP_SECRET, WEBHOOK_VERIFY_TOKEN,
# FB_PAGE_ID e FB_PAGE_TOKEN.
name: bot

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/bot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirmar os Secrets
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.META_APP_SECRET }}
          D: ${{ secrets.WEBHOOK_VERIFY_TOKEN }}
          E: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          falta=""
          [ -n "$A" ] || falta="$falta CLOUDFLARE_API_TOKEN"; [ -n "$B" ] || falta="$falta CLOUDFLARE_ACCOUNT_ID"
          [ -n "$C" ] || falta="$falta META_APP_SECRET"; [ -n "$D" ] || falta="$falta WEBHOOK_VERIFY_TOKEN"; [ -n "$E" ] || falta="$falta FB_PAGE_TOKEN"
          [ -z "$falta" ] || { echo "::error::Faltam os Secrets:$falta (Settings → Secrets and variables → Actions)"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar o worker no Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          WEBHOOK_VERIFY_TOKEN: ${{ secrets.WEBHOOK_VERIFY_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g --no-audit --no-fund wrangler@4 > /dev/null
          wrangler deploy
          for s in FB_PAGE_TOKEN META_APP_SECRET WEBHOOK_VERIFY_TOKEN; do printf '%s' "${!s}" | wrangler secret put "$s"; done
      - name: Ligar a página aos avisos da Meta
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          # O Instagram só manda os avisos de comentários se a app estiver ligada à página.
          curl -fsS -X POST "https://graph.facebook.com/v21.0/${FB_PAGE_ID}/subscribed_apps" \
            --data-urlencode "subscribed_fields=feed" --data-urlencode "access_token=${FB_PAGE_TOKEN}" | grep -q '"success":true' \
            && echo "Página ligada aos avisos." || { echo "A Meta não ligou a página aos avisos."; exit 1; }
          echo "### Endereço do webhook" >> "$GITHUB_STEP_SUMMARY"
          echo "https://verdejar-bot.<o-teu-subdominio>.workers.dev/webhook (o subdomínio aparece no registo do passo anterior)" >> "$GITHUB_STEP_SUMMARY"
